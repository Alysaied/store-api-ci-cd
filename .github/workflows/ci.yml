name: Store API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: store-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
         distribution: temurin
         java-version: 26

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: build and test
        run: ./mvnw clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-api
          path: store-api/target/*.jar

  docker:
    needs: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: store-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: store-api
          path: store-api/target

      - name: Build Docker image
        run: docker build -t ghcr.io/alysaied/store-api:${{ github.sha }} .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/alysaied/store-api:${{ github.sha }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Linux
      - X64
    steps:
      - name: Pull new Docker image
        run:
          docker pull ghcr.io/alysaied/store-api:${{ github.sha }}
      - name: Remove old container
        run: docker rm -f store-api-container || true
      - name: Start new container
        run: |
          docker run -d \
            --name store-api-container \
            --restart unless-stopped \
            -p 8080:8080 \
            ghcr.io/alysaied/store-api:${{ github.sha }}
      - name: Verify deployment
        run: |
          echo "waiting for Store API to become healthy..."
          
          for i in {1..10}; do
            if curl -f http://localhost:8080/api/products; then 
              echo "Store API is healthy"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done 
          echo "Store API failed health check"
          docker logs store-api-container
          exit 1